{% extends "base.html" %}
{% load i18n %}

{% block title %}Sign Out - Listen Hear!{% endblock title %}

{% block content %}
  <div class="row justify-content-center py-5">
    <div class="col-sm-8 col-md-6 col-lg-4">
      <div class="card border-0 shadow-sm">

        <!-- Header bar -->
        <div class="card-header border-0 py-4 text-center" style="background-color: var(--primary-blue);">
          <i class="bi bi-box-arrow-right" style="font-size: 2rem; color: var(--primary-yellow);"></i>
          <h4 class="mt-2 mb-0 text-white fw-semibold">{% trans "Sign Out" %}</h4>
        </div>

        <div class="card-body p-4 text-center">
          <p class="text-muted mb-4">{% trans "Are you sure you want to sign out?" %}</p>

          <form method="post" action="{% url 'account_logout' %}">
            {% csrf_token %}
            {{ redirect_field }}
            <div class="d-grid gap-2">
              <button type="submit" class="btn py-2 fw-semibold" style="background-color: var(--primary-blue); color: white;">
                <i class="bi bi-box-arrow-right me-2"></i>{% trans "Yes, Sign Out" %}
              </button>
              <a href="javascript:history.back()" class="btn btn-outline-secondary py-2">
                {% trans "Cancel" %}
              </a>
            </div>
          </form>
        </div>

      </div>
    </div>
  </div>
{% endblock content %}
