<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ post.title }}</title>
</head>
<body style="margin:0;padding:0;background:#f4f6ff;font-family:'DM Sans',Arial,sans-serif;">
  <table width="100%" cellpadding="0" cellspacing="0" style="background:#f4f6ff;padding:40px 16px;">
    <tr>
      <td align="center">
        <table width="600" cellpadding="0" cellspacing="0" style="max-width:600px;width:100%;background:#ffffff;border-radius:16px;overflow:hidden;border:1px solid #e0e4f4;">

          <!-- Header -->
          <tr>
            <td style="background:#0311FC;padding:32px 40px;">
              <p style="margin:0;font-family:Arial,sans-serif;font-size:11px;font-weight:700;letter-spacing:0.18em;text-transform:uppercase;color:#FFFF00;">Listen Hear</p>
              <h1 style="margin:8px 0 0;font-family:Georgia,serif;font-size:28px;font-weight:700;color:#ffffff;line-height:1.2;">New Post</h1>
            </td>
          </tr>

          <!-- Post title & meta -->
          <tr>
            <td style="padding:40px 40px 0;">
              <h2 style="margin:0 0 10px;font-family:Georgia,serif;font-size:26px;font-weight:700;color:#07091a;line-height:1.25;">{{ post.title }}</h2>
              {% if post.author_name %}
              <p style="margin:0 0 28px;font-size:13px;color:#8a92a8;">By {{ post.author_name }}</p>
              {% else %}
              <p style="margin:0 0 28px;"></p>
              {% endif %}
            </td>
          </tr>

          <!-- Excerpt -->
          <tr>
            <td style="padding:0 40px 8px;font-size:16px;color:#333333;line-height:1.75;">
              {{ post.body|striptags|truncatewords:50 }}
            </td>
          </tr>

          <!-- Read more CTA -->
          <tr>
            <td style="padding:24px 40px 40px;">
              <a href="{{ post_url }}"
                 style="display:inline-block;background:#0311FC;color:#ffffff;text-decoration:none;font-size:15px;font-weight:700;padding:14px 32px;border-radius:8px;">
                Continue Reading &rarr;
              </a>
            </td>
          </tr>

          <!-- Footer -->
          <tr>
            <td style="padding:24px 40px;border-top:1px solid #e0e4f4;background:#f8f9fc;">
              <p style="margin:0;font-size:12px;color:#8a92a8;line-height:1.6;">
                You are receiving this because you subscribed to updates from
                <a href="{{ site_url }}" style="color:#0311FC;text-decoration:none;">listenhearsmarthomes.com</a>.<br>
                <a href="{{ unsubscribe_url }}" style="color:#8a92a8;">Unsubscribe</a>
              </p>
            </td>
          </tr>

        </table>
      </td>
    </tr>
  </table>
</body>
</html>
